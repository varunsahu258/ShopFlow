---
# ansible/playbooks/provision.yml
# Provisions Ubuntu 22.04 nodes for Kubernetes cluster
# Usage: ansible-playbook -i inventory/production.ini playbooks/provision.yml

- name: Common setup on all nodes
  hosts: k8s_cluster
  become: true
  vars:
    k8s_version: "1.28"
    containerd_version: "1.7.0"
    image_tag: "{{ image_tag | default('latest') }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - socat
          - conntrack
          - ipset
        state: present

    - name: Disable swap (K8s requirement)
      shell: |
        swapoff -a
        sed -i '/\sswap\s/d' /etc/fstab
      changed_when: true

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Set sysctl params for Kubernetes
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: net.bridge.bridge-nf-call-iptables,  value: '1' }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: '1' }
        - { key: net.ipv4.ip_forward,                 value: '1' }

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

    - name: Install containerd
      apt:
        name: containerd.io
        state: present
        update_cache: yes

    - name: Configure containerd
      shell: |
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      notify: Restart containerd

    - name: Add Kubernetes APT key
      apt_key:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        state: present

    - name: Add Kubernetes APT repository
      apt_repository:
        repo: "deb https://apt.kubernetes.io/ kubernetes-xenial main"

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - "kubelet={{ k8s_version }}.*"
          - "kubeadm={{ k8s_version }}.*"
          - "kubectl={{ k8s_version }}.*"
        state: present
        update_cache: yes

    - name: Hold kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

  handlers:
    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes


# ── Init master node ──────────────────────────────────────────────────────────
- name: Initialize Kubernetes master
  hosts: k8s_masters
  become: true

  tasks:
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_done

    - name: Initialize kubeadm
      shell: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not kubeadm_init_done.stat.exists
      register: kubeadm_output

    - name: Create kubeconfig for ubuntu user
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown ubuntu:ubuntu /home/ubuntu/.kube/config
      when: not kubeadm_init_done.stat.exists

    - name: Install Flannel CNI
      become: false
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      when: not kubeadm_init_done.stat.exists

    - name: Get join command
      shell: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Set join command as fact
      set_fact:
        join_command: "{{ join_command_raw.stdout }}"


# ── Join worker nodes ─────────────────────────────────────────────────────────
- name: Join worker nodes to cluster
  hosts: k8s_workers
  become: true

  tasks:
    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: already_joined

    - name: Join cluster
      shell: "{{ hostvars[groups['k8s_masters'][0]]['join_command'] }}"
      when: not already_joined.stat.exists


# ── Deploy application ────────────────────────────────────────────────────────
- name: Deploy ShopFlow application
  hosts: k8s_masters
  become: false
  vars:
    app_namespace: shopflow

  tasks:
    - name: Create namespace
      shell: kubectl get namespace {{ app_namespace }} || kubectl create namespace {{ app_namespace }}

    - name: Copy K8s manifests
      copy:
        src: "{{ playbook_dir }}/../k8s/"
        dest: /tmp/shopflow-k8s/

    - name: Apply K8s manifests
      shell: |
        kubectl apply -f /tmp/shopflow-k8s/base/ -n {{ app_namespace }}
        kubectl set image deployment/backend  backend=yourorg/shopflow-backend:{{ image_tag }}  -n {{ app_namespace }} || true
        kubectl set image deployment/frontend frontend=yourorg/shopflow-frontend:{{ image_tag }} -n {{ app_namespace }} || true

    - name: Wait for deployments to be ready
      shell: |
        kubectl rollout status deployment/backend  -n {{ app_namespace }} --timeout=5m
        kubectl rollout status deployment/frontend -n {{ app_namespace }} --timeout=5m
